name: govulncheck
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "22 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - path: "."
            name: "root"
          - path: "example/counter"
            name: "counter"
          - path: "example/fancy-counter"
            name: "fancy-counter"
          - path: "example/classifieds"
            name: "classifieds"
          - path: "example/tailwindcss"
            name: "tailwindcss"
          - path: "example/webcomponents"
            name: "webcomponents"
          - path: "example/sqlitesessions"
            name: "sqlitesessions"
          - path: "example/calculator"
            name: "calculator"
          - path: "example/todolist"
            name: "todolist"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          check-latest: true
      - name: Install Wails system dependencies
        if: matrix.project.name == 'calculator'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: govulncheck (${{ matrix.project.name }})
        working-directory: ${{ matrix.project.path }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
