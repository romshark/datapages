name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go 1.27.3
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          check-latest: true

      # Validate the tag's changelog section and compare link before publishing.
      - name: Cut the release notes from CHANGELOG.md
        run: go run ./internal/tools/release-notes -tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The site serves the pages of the latest release, which is now this one.
  # A tag does not start the Pages workflow, which runs for pushes to main.
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
