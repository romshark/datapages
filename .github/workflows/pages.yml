name: Deploy GitHub Pages

# mage genDocs renders the site into docs/. docpages writes the docs of main
# and of every release from its Git tag into docs/docs/, and
# internal/tools/render-landing writes the landing page docs/index.html.
# Git ignores these files, so each deployment renders them.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "guide/**"
      - "internal/tools/render-landing/**"
      - "magefiles/**"
      - "CHANGELOG.md"
      - "FAQ.md"
      - "SPECIFICATION.md"
      - ".github/workflows/pages.yml"
  # The release workflow calls this after it publishes a release.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # A release commit reaches main before its tag. Pages identifies a deployment
  # by its commit and ignores a second deployment of the same commit, which
  # would keep the pages deployed without the release. The release workflow
  # deploys the commit once the tag exists.
  pending-release:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # The newest version of CHANGELOG.md has no tag yet.
      - id: pending
        run: |
          version=$(sed -nE 's/^## \[([0-9][^]]*)\].*/\1/p' CHANGELOG.md | head -n 1)
          if [[ -n "${version}" ]] &&
            [[ -z "$(git ls-remote --tags origin "refs/tags/v${version}")" ]]; then
            echo "pending=true" >> "${GITHUB_OUTPUT}"
          fi

  deploy:
    needs: pending-release
    if: needs.pending-release.outputs.pending != 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      # main, also when a release calls this from its tag. docpages reads the
      # releases from the tags, which a shallow clone lacks.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            guide/go.sum
            internal/tools/render-landing/go.sum

      - name: Install mage
        run: go install github.com/magefile/mage@latest

      - name: Render the site
        run: mage genDocs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
