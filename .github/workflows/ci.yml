on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "22 10 * * *"
  workflow_dispatch:

name: CI

permissions:
  contents: read

jobs:
  # The mage targets cover every module from the repository root.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Go 1.27.3
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          check-latest: true
          cache-dependency-path: "**/go.sum"

      - name: Install mage
        run: go install github.com/magefile/mage@latest

      - name: Check formatting (gofumpt)
        run: mage checkFmt

      - name: Check go.mod tidy
        run: mage checkMod

      # Runs every generator and fails if a file changes: templ everywhere,
      # the datapages code of every example and acceptance case, the AI agent
      # instructions of every example, docs/style.css.
      - name: Check generated code is current
        run: mage checkGen

      - name: Lint datapages examples
        run: mage lintDatapages

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - path: "."
            name: "root"
          # The 4 slowest test packages of the root module are CPU-bound.
          # A runner has 4 vCPUs, hence 1 runner per package.
          - path: "."
            name: "parser"
            packages: "./internal/parser"
          - path: "."
            name: "generator"
            packages: "./internal/generator"
          - path: "."
            name: "cmd"
            packages: "./internal/cmd"
          - path: "."
            name: "acceptance"
            packages: "./internal/acceptance"
          - path: "example/counter"
            name: "counter"
          - path: "example/classifieds"
            name: "classifieds"
          - path: "example/tailwindcss"
            name: "tailwindcss"
          - path: "example/webcomponents"
            name: "webcomponents"
          - path: "example/sqlitesessions"
            name: "sqlitesessions"
          - path: "example/calculator"
            name: "calculator"
          - path: "example/todolist"
            name: "todolist"
          - path: "example/offline-cache"
            name: "offline-cache"
          - path: "example/fast-shim"
            name: "fast-shim"
          - path: "example/file-upload"
            name: "file-upload"
          - path: "example/docs"
            name: "docs"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # The cache key hashes the module's go.sum, which needs the checkout.
      # A shared key would make the first job to finish save the cache for all.
      - name: Install Go 1.27.3
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          check-latest: true
          cache-dependency-path: ${{ matrix.project.path }}/go.sum

      - name: Install Wails system dependencies
        if: matrix.project.name == 'calculator'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # internal/cmd TestWatch starts the templier engine, which runs templ as
      # a command. mage itself only ever `go run`s it, which puts nothing on
      # PATH. Pinned to the version toolTempl in magefiles generates with.
      - name: Install templ
        if: matrix.project.name == 'cmd'
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1100

      # The root entry tests the packages without an entry of their own.
      # The acceptance cases run in modules of their own:
      # TestMain merges their profiles into the file -cover.out names.
      - name: Run tests with coverage
        working-directory: ${{ matrix.project.path }}
        env:
          PACKAGES: ${{ matrix.project.packages || './...' }}
        run: |
          if [ "${{ matrix.project.name }}" = root ]; then
            PACKAGES=$(go list ./... | grep -vxE \
              'github.com/romshark/datapages/internal/(parser|generator|cmd|acceptance)')
          fi
          if [ "${{ matrix.project.name }}" = acceptance ]; then
            go test -timeout 15m $PACKAGES -args -cover.out="$PWD/coverage.out"
          else
            go test -timeout 15m -covermode=atomic -coverprofile=coverage.out $PACKAGES
          fi

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.project.path }}/coverage.out
          flag-name: ${{ matrix.project.name }}
          parallel: true

      # Runs once per module: the root entry builds the whole root module.
      - name: Compile
        if: ${{ !matrix.project.packages }}
        working-directory: ${{ matrix.project.path }}
        run: go build -o /dev/null ./...

  # The editor of example/docs merges concurrent changes in the browser.
  # Node runs its TypeScript tests without a build step from version 24.
  test-docs-editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/docs/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # Node strips the types without checking them.
      - name: Check types
        run: npm run check

      - name: Run tests
        run: npm test

  # Tests the root module against the newest release of every dependency.
  # The result depends on upstream releases, not on the commit, which is why
  # it runs daily and not on push or pull request.
  test-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Shares the cache key of the root entry of test.
      - name: Install Go 1.27.3
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install mage
        run: go install github.com/magefile/mage@latest

      - name: Update to latest deps
        run: go get -u -t ./...

      # Every sub-module replaces the root module.
      # Upgrading root's requirements changes what those sub-modules select.
      # Without a tidy their go.sum files lack the newly selected versions and
      # the root tests that parse them fail to load their packages.
      - name: Tidy sub-modules against the upgraded root
        run: mage modTidy

      # internal/cmd TestWatch starts the templier engine, which runs templ as
      # a command. mage itself only ever `go run`s it, which puts nothing on PATH.
      # Pinned to the version toolTempl in magefiles generates with.
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1100

      - name: Run tests
        run: go test -timeout 15m ./...

      - name: Compile
        run: go build -o /dev/null ./...

  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
