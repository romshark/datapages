on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "22 10 * * *"
  workflow_dispatch:

name: CI

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - path: "."
            name: "root"
          - path: "example/counter"
            name: "counter"
          - path: "example/classifieds"
            name: "classifieds"
          - path: "example/tailwindcss"
            name: "tailwindcss"
          - path: "example/webcomponents"
            name: "webcomponents"
          - path: "example/sqlitesessions"
            name: "sqlitesessions"
          - path: "example/calculator"
            name: "calculator"
          - path: "example/todolist"
            name: "todolist"
          - path: "example/offline-cache"
            name: "offline-cache"
          - path: "example/fast-shim"
            name: "fast-shim"
        deps: [locked, latest]
        exclude:
          # Only run latest-deps for the root module.
          - project:
              name: "classifieds"
            deps: latest
          - project:
              name: "tailwindcss"
            deps: latest
          - project:
              name: "webcomponents"
            deps: latest
          - project:
              name: "sqlitesessions"
            deps: latest
          - project:
              name: "calculator"
            deps: latest
          - project:
              name: "todolist"
            deps: latest
          - project:
              name: "offline-cache"
            deps: latest
          - project:
              name: "fast-shim"
            deps: latest
    steps:
      - name: Install Go 1.27.0
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: true
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mage
        run: go install github.com/magefile/mage@latest

      - name: Check formatting (gofumpt)
        if: matrix.deps == 'locked'
        run: mage checkFmt

      - name: Check go.mod tidy
        if: matrix.deps == 'locked'
        run: mage checkMod

      # Runs every generator and fails if a file changes: templ everywhere,
      # the datapages code of every example and acceptance case, docs/style.css.
      # Needs a clean tree, hence it runs before the tests write coverage.out.
      - name: Check generated code is current
        if: matrix.project.name == 'root' && matrix.deps == 'locked'
        run: mage checkGen

      - name: Update to latest deps
        if: matrix.deps == 'latest'
        working-directory: ${{ matrix.project.path }}
        run: go get -u -t ./...

      # Every sub-module replaces the root module.
      # Upgrading root's requirements changes what those sub-modules select.
      # Without a tidy their go.sum files lack the newly selected versions and
      # the root tests that parse them fail to load their packages.
      - name: Tidy sub-modules against the upgraded root
        if: matrix.project.name == 'root' && matrix.deps == 'latest'
        run: mage modTidy

      - name: Install Wails system dependencies
        if: matrix.project.name == 'calculator'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # internal/cmd TestWatch starts the templier engine, which runs templ as
      # a command. mage itself only ever `go run`s it, which puts nothing on
      # PATH. The version is free: the engine only checks that templ runs.
      - name: Install templ
        if: matrix.project.name == 'root'
        run: go install github.com/a-h/templ/cmd/templ@latest

      # Test and report coverage
      - name: Run tests with coverage
        working-directory: ${{ matrix.project.path }}
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage to Coveralls
        if: matrix.deps == 'locked'
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.project.path }}/coverage.out
          flag-name: ${{ matrix.project.name }}
          parallel: true

      - name: Lint datapages examples
        if: matrix.project.name == 'root' && matrix.deps == 'locked'
        run: mage lintDatapages

      # Try compile
      - name: Compile
        working-directory: ${{ matrix.project.path }}
        run: go build -o /dev/null ./...

  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
