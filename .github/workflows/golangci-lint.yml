name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
permissions:
  contents: read
# Optional: allow read access to pull request. Use with `only-new-issues` option.
# pull-requests: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - path: "."
            name: "root"
          - path: "example/counter"
            name: "example/counter"
          - path: "example/fancy-counter"
            name: "example/fancy-counter"
          - path: "example/classifieds"
            name: "example/classifieds"
          - path: "example/tailwindcss"
            name: "example/tailwindcss"
          - path: "example/webcomponents"
            name: "example/webcomponents"
          - path: "example/sqlitesessions"
            name: "example/sqlitesessions"
          - path: "example/calculator"
            name: "example/calculator"
          - path: "example/todolist"
            name: "example/todolist"
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: true
          cache: false
      - uses: actions/checkout@v7
      - name: Install Wails system dependencies
        if: matrix.project.name == 'example/calculator'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: golangci-lint (${{ matrix.project.name }})
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ matrix.project.path }}
