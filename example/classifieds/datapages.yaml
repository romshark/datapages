cmd: cmd/server
watch:
  app-host: "http://localhost:52000"
  exclude:
    - ".*"
    - "*~"
    - "grafana/*"
  log:
    level: erronly
    print-js-debug-logs: true
  compiler:
    env:
      CGO_ENABLED: "0"
  custom-watchers:
    - name: "Go mod update"
      include:
        - "go.mod"
        - "go.sum"
      fail-on-error: true
      requires: rebuild
    - name: "CSS"
      include:
        - "app/static/style.css"
      requires: reload
  # http://localhost:7332 serves the app through Toxiproxy,
  # with its settings page at http://localhost:7333/.
  toxiproxy:
    toxics:
      # Every response arrives late, and the responses of 1 browser share 512 KB/s.
      latency:
        downstream:
          latency: 150ms
          jitter: 50ms
      bandwidth:
        downstream:
          rate: 512
    endpoints:
      # A sent message reaches the server 1s late.
      "POST /messages/sendmessage/{$}":
        latency:
          upstream:
            latency: 1s
      # The stream of the messages page resets 60s after its first event,
      # and Datastar reconnects it.
      "GET /messages/_$/{$}":
        reset-peer:
          downstream:
            timeout: 60s
      # Static files load without the bandwidth limit.
      "GET /static/":
        bandwidth:
          downstream:
            disabled: true
