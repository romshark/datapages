cmd: cmd/server
watch:
  app-host: "http://localhost:52000"
  exclude:
    - ".*"
    - "*~"
    - "grafana/*"
  log:
    level: erronly
    print-js-debug-logs: true
  compiler:
    env:
      CGO_ENABLED: "0"
  custom-watchers:
    - name: "Go mod update"
      include:
        - "go.mod"
        - "go.sum"
      fail-on-error: true
      requires: rebuild
    - name: "CSS"
      include:
        - "app/static/style.css"
      requires: reload
  # http://localhost:7332 serves the app through Toxiproxy,
  # with its settings page at http://localhost:7333/, which applies the presets.
  # Without host and ui-host, the OS picks the ports.
  toxiproxy:
    host: localhost:7332
    ui-host: localhost:7333
    presets:
      - name: Flaky network
        toxics:
          # Every response arrives late, and the responses of 1 browser share 512 KB/s.
          latency:
            downstream:
              latency: 150ms
              jitter: 50ms
          client-bandwidth:
            downstream:
              rate: 512000
        endpoints:
          # A sent message reaches the server 1s late.
          "POST /messages/sendmessage/{$}":
            latency:
              upstream:
                latency: 1s
          # The stream of the messages page resets 60s after its first event,
          # and Datastar reconnects it.
          "GET /messages/_$/{$}":
            reset-peer:
              downstream:
                timeout: 60s
          # Static files load without the client bandwidth limit.
          "GET /static/":
            client-bandwidth:
              downstream:
                disabled: true
