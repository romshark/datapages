  <!--
    3×3 grid of ducks at 80 px spacing. Grid offsets (40, 120, 200)
    place each row/column such that the gap from the last duck to the
    tile edge plus the gap from the first duck to the opposite edge
    sums to the intra-tile spacing (40 + 40 = 80), which keeps the
    spacing uniform when the tile repeats.

    Rotations are hand-picked pseudo-random angles within ±35° — the
    arrangement is systematic but no two ducks point the same way.
  -->
  <g opacity="0.1">
    <use href="#duck" width="50" height="50" transform="translate(15 15) rotate(-22 25 25)"/>
    <use href="#duck" width="50" height="50" transform="translate(95 15) rotate(14 25 25)"/>
    <use href="#duck" width="50" height="50" transform="translate(175 15) rotate(-34 25 25)"/>
    <use href="#duck" width="50" height="50" transform="translate(15 95) rotate(27 25 25)"/>
    <use href="#duck" width="50" height="50" transform="translate(95 95) rotate(-8 25 25)"/>
    <use href="#duck" width="50" height="50" transform="translate(175 95) rotate(19 25 25)"/>
    <use href="#duck" width="50" height="50" transform="translate(15 175) rotate(33 25 25)"/>
    <use href="#duck" width="50" height="50" transform="translate(95 175) rotate(-15 25 25)"/>
    <use href="#duck" width="50" height="50" transform="translate(175 175) rotate(6 25 25)"/>
  </g>
