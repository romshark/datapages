app: app
gen:
  package: datapagesgen
  prometheus: false
cmd: cmd/server
assets:
  url-prefix: /static/
  dir: ./app/static/
watch:
  app-host: "http://localhost:8080"
  compiler:
    env:
      HOST: "localhost"
      PORT: "8080"
  exclude:
    - ".git/**"
    - ".*"
    - "*~"
    - "js/node_modules/**"
  custom-watchers:
    - name: "Bundle web components (esbuild)"
      include:
        - "js/src/**/*.ts"
      cmd: "cd js && node build.mjs"
      fail-on-error: true
      requires: reload
