cmd: cmd/server
watch:
  app-host: "http://localhost:8080"
  compiler:
    env:
      HOST: "localhost"
      PORT: "8080"
  exclude:
    - ".git/**"
    - ".*"
    - "*~"
  watcher-ignore:
    # Drop node_modules from the fs watcher entirely: it's a large tree that
    # would otherwise consume OS watch descriptors and be checksummed at startup.
    - "js/node_modules/**"
  custom-watchers:
    - name: "Bundle web components (esbuild)"
      include:
        - "js/src/**/*.ts"
      cmd: "cd js && node build.mjs"
      fail-on-error: true
      requires: reload
